# Kimi Code CLI configuration template
# Generated by gum installer. Customize as needed.
# Docs: https://moonshotai.github.io/kimi-cli/en/configuration/config-files.html
#
# Tip: Run /login (or /setup) in Kimi shell mode for an interactive setup wizard
# that configures provider credentials automatically.

# ---------------------------------------------------------------------------
# Default behavior
# ---------------------------------------------------------------------------

# Model to use when no --model flag is passed (must match a key in [models])
default_model = "claude-sonnet"

# Enable extended thinking by default (set true for complex reasoning tasks)
default_thinking = false

# YOLO mode: auto-approve all file edits and shell commands without prompting.
# Leave false for safety; toggle per-session with /yolo when needed.
default_yolo = false

# ---------------------------------------------------------------------------
# Providers
# ---------------------------------------------------------------------------
# Each provider needs: type, base_url, api_key
# API keys can also be set via environment variables (preferred for security).
# Run /login in Kimi shell to configure interactively.

[providers.anthropic]
type = "anthropic"
base_url = "https://api.anthropic.com"
# SECURITY: Prefer setting ANTHROPIC_API_KEY env var instead of hardcoding here.
# Uncomment and fill in only if you cannot use environment variables:
# api_key = "sk-ant-..."

# --- OpenAI ---
# SECURITY: Prefer setting OPENAI_API_KEY env var instead of hardcoding.

# [providers.openai]
# type = "openai_responses"
# base_url = "https://api.openai.com/v1"
# api_key = "sk-..."

# --- Google Generative AI ---
# SECURITY: Prefer setting GOOGLE_GENERATIVE_AI_API_KEY env var instead of hardcoding.

# [providers.google]
# type = "google_genai"
# api_key = "AIza..."

# --- Kimi / Moonshot ---
# SECURITY: Prefer setting MOONSHOT_API_KEY env var instead of hardcoding.

# [providers.kimi]
# type = "kimi"
# base_url = "https://api.kimi.com/coding/v1"
# api_key = "sk-..."

# --- Mistral ---
# SECURITY: Prefer setting MISTRAL_API_KEY env var instead of hardcoding.

# [providers.mistral]
# type = "openai_legacy"
# base_url = "https://api.mistral.ai/v1"
# api_key = "..."

# --- Groq ---
# SECURITY: Prefer setting GROQ_API_KEY env var instead of hardcoding.

# [providers.groq]
# type = "openai_legacy"
# base_url = "https://api.groq.com/openai/v1"
# api_key = "gsk_..."

# --- Vertex AI ---
# Uses Google Cloud credentials (ADC). No api_key needed if gcloud is configured.

# [providers.vertexai]
# type = "vertexai"
# base_url = "https://us-central1-aiplatform.googleapis.com/v1"

# --- Local: llama-server (OpenAI-compatible) ---
# For offline/local inference via llama.cpp server.

# [providers.llama-local]
# type = "openai_legacy"
# base_url = "http://10.0.0.194:8080/v1"
# api_key = "no-key-needed"

# --- Local: Ollama ---
# For offline/local inference via Ollama.

# [providers.ollama]
# type = "openai_legacy"
# base_url = "http://localhost:11434/v1"
# api_key = "ollama"

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
# Each model references a provider and specifies the API model identifier.
# max_context_size is in tokens.
# capabilities: "thinking" (extended thinking), "image_in" (vision input)

# --- Active: Anthropic models ---

[models.claude-sonnet]
provider = "anthropic"
model = "claude-sonnet-4-5"
max_context_size = 200000
capabilities = ["thinking", "image_in"]

