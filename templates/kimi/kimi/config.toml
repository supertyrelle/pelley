# ---------------------------------------------------------------------------
# Loop control
# ---------------------------------------------------------------------------
# Governs the agentic execution loop. Defaults are sensible for most workflows.

[loop_control]
max_steps_per_turn = 100      # Max tool-call steps per user turn
max_retries_per_step = 3      # Retries on transient errors per step
max_ralph_iterations = 0      # Self-reflection iterations (0 = disabled)
reserved_context_size = 50000 # Tokens reserved for system prompt + response

# ---------------------------------------------------------------------------
# MCP (Model Context Protocol)
# ---------------------------------------------------------------------------
# MCP servers are configured in ~/.kimi/mcp.json (generated by gum installer).
# This section controls MCP client behavior only.

[mcp.client]
tool_call_timeout_ms = 60000  # Timeout for MCP tool invocations (ms)

